# Auto-build the Nanban Android APK on every push.
# After the first push to GitHub:
#   1. Open the "Actions" tab on your repo.
#   2. Click the latest "Build Android APK" run.
#   3. Scroll to "Artifacts" at the bottom.
#   4. Download "nanban-apk" — it contains Nanban.apk, ready to install on any Android phone.
name: Build Android APK

on:
  push:
    paths:
      - 'android/**'
      - '.github/workflows/build-android-apk.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant gradlew execute permission
        run: chmod +x ./gradlew

      - name: Build debug APK
        run: ./gradlew assembleRelease

      - name: Rename APK
        run: |
          mkdir -p ../out
          cp app/build/outputs/apk/release/app-release.apk ../out/Nanban.apk || \
          cp app/build/outputs/apk/debug/app-debug.apk ../out/Nanban.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: nanban-apk
          path: out/Nanban.apk
