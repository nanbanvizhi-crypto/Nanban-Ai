# One-click-ish deploy on Render (https://render.com).
# In Render: New + -> Blueprint -> connect your GitHub repo with this file.
# Then set the secret env vars (API key, users) in the dashboard.
services:
  - type: web
    name: nanban
    runtime: docker
    dockerfilePath: ./cloud/Dockerfile
    dockerContext: .
    plan: starter            # cheap CPU plan; no GPU needed
    healthCheckPath: /api/health
    disk:
      name: nanban-data
      mountPath: /app/data
      sizeGB: 1
    envVars:
      - key: NANBAN_LLM_BACKEND
        value: hosted
      - key: NANBAN_HOSTED_BASE_URL
        value: https://api.groq.com/openai/v1
      - key: NANBAN_HOSTED_MODEL
        value: openai/gpt-oss-20b
      - key: NANBAN_HOSTED_API_KEY
        sync: false          # set this secret in the Render dashboard
      - key: NANBAN_USERS
        sync: false          # e.g. dev:your-strong-password
      - key: NANBAN_ADMIN_USERS
        value: dev
      - key: NANBAN_WEB_COMPUTER_MODE
        value: "false"
      - key: NANBAN_SECURITY_TAB
        value: "false"
