<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Kali Linux — Nanban Desktop</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ctext y='52' font-size='52'%3E%F0%9F%90%89%3C/text%3E%3C/svg%3E">
<style>
  :root { --bar:#0b0f14; --fg:#d9e2ec; --dim:#8a96a3; --acc:#2bd4bd; --bad:#ff6b6b; --warn:#ffb347; }
  html,body { margin:0; height:100%; background:#000; color:var(--fg); font:13px/1.3 "Segoe UI",system-ui,-apple-system,sans-serif; overflow:hidden; }
  #bar { position:fixed; inset:0 0 auto 0; height:36px; display:flex; align-items:center; gap:10px; padding:0 10px;
         background:var(--bar); border-bottom:1px solid #1d2730; z-index:10; user-select:none; }
  #bar .brand { font-weight:700; letter-spacing:.2px; display:flex; align-items:center; gap:7px; }
  #bar .brand small { color:var(--dim); font-weight:500; }
  #st { display:flex; align-items:center; gap:6px; color:var(--dim); }
  #st i { width:9px; height:9px; border-radius:50%; background:var(--warn); display:inline-block; box-shadow:0 0 0 2px #1d2730; }
  #st.on i { background:var(--acc); } #st.off i { background:var(--bad); }
  #bar .sp { flex:1; }
  #bar button { background:#141b23; color:var(--fg); border:1px solid #223040; border-radius:7px; padding:5px 10px; cursor:pointer; font:inherit; }
  #bar button:hover { background:#1b2531; border-color:#2f4256; }
  #bar button.acc { background:var(--acc); color:#06211e; border-color:var(--acc); font-weight:600; }
  #screen { position:fixed; inset:36px 0 0 0; background:#000; }
  body.fs #bar { transform:translateY(-36px); transition:transform .2s; }
  body.fs #screen { inset:0; }
  #peek { position:fixed; top:0; left:0; right:0; height:6px; z-index:11; display:none; }
  body.fs #peek { display:block; }
  body.fs.peek #bar { transform:none; }
  #overlay { position:fixed; inset:36px 0 0 0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px;
             background:radial-gradient(1200px 600px at 50% 40%, #0f1a22 0%, #05080b 70%); z-index:5; text-align:center; padding:20px; }
  #overlay.hide { display:none; }
  #overlay .dragon { font-size:64px; filter:drop-shadow(0 0 18px rgba(43,212,189,.35)); }
  #overlay h1 { margin:0; font-size:20px; font-weight:700; }
  #overlay p { margin:0; color:var(--dim); max-width:520px; }
  .spin { width:26px; height:26px; border:3px solid #223040; border-top-color:var(--acc); border-radius:50%; animation:r 1s linear infinite; }
  @keyframes r { to { transform:rotate(360deg); } }
  #hint { color:var(--dim); font-size:12px; }
  @media (max-width:720px) { #hint, #bar .brand small { display:none; } }
</style>
</head>
<body>
<div id="bar">
  <div class="brand">🐉 Kali Linux <small>· Nanban Desktop</small></div>
  <div id="st"><i></i><span id="stt">starting…</span></div>
  <span class="sp"></span>
  <span id="hint">Real Kali OS · click inside to use keyboard &amp; mouse</span>
  <button id="b-cad" title="Send Ctrl+Alt+Del">Ctrl+Alt+Del</button>
  <button id="b-clip" title="Paste your clipboard into Kali">📋 Paste</button>
  <button id="b-re" title="Reconnect">↻</button>
  <button id="b-fs" class="acc" title="Full screen (Esc / move mouse to top to show bar)">⛶ Full screen</button>
  <button id="b-back" title="Back to Nanban">← Nanban</button>
</div>
<div id="peek"></div>
<div id="screen"></div>
<div id="overlay">
  <div class="dragon">🐉</div>
  <h1>Starting your Kali Linux desktop…</h1>
  <p id="omsg">Connecting to the real Kali XFCE desktop running on this computer. First start takes a few seconds.</p>
  <div class="spin" id="ospin"></div>
</div>

<script type="module">
  import RFB from './core/rfb.js';

  const $ = (s) => document.querySelector(s);
  const st = $('#st'), stt = $('#stt'), overlay = $('#overlay'), omsg = $('#omsg'), ospin = $('#ospin');
  const PASS = 'nanban';
  const wsUrl = (location.protocol === 'https:' ? 'wss' : 'ws') + '://' + location.host + '/websockify';
  let rfb = null, tries = 0, timer = null, wantReconnect = true;

  function setStatus(cls, text) { st.className = cls; stt.textContent = text; }
  function showOverlay(text, spinning = true) { overlay.classList.remove('hide'); omsg.textContent = text; ospin.style.display = spinning ? '' : 'none'; }

  function connect() {
    clearTimeout(timer);
    if (rfb) { const old = rfb; rfb = null; try { old.disconnect(); } catch (e) {} }
    setStatus('', tries ? `reconnecting… (${tries})` : 'connecting…');
    try {
      rfb = new RFB($('#screen'), wsUrl, { credentials: { password: PASS }, shared: true });
    } catch (e) { scheduleRetry('Cannot open connection: ' + e); return; }
    rfb.scaleViewport = false;     // 1:1 pixels …
    rfb.resizeSession = true;      // … and the Kali desktop resizes itself to this window
    rfb.clipViewport = false;
    rfb.showDotCursor = true;
    rfb.background = '#000';
    rfb.addEventListener('connect', () => {
      tries = 0; setStatus('on', 'connected'); overlay.classList.add('hide'); rfb.focus();
    });
    rfb.addEventListener('credentialsrequired', () => rfb.sendCredentials({ password: PASS }));
    rfb.addEventListener('securityfailure', (e) => scheduleRetry('Login to the desktop failed: ' + (e.detail && e.detail.reason || '')));
    rfb.addEventListener('disconnect', (e) => {
      if (!wantReconnect) return;
      scheduleRetry(e.detail && e.detail.clean ? 'Desktop closed — reconnecting…' : 'Desktop is still starting — waiting…');
    });
  }

  function scheduleRetry(msg) {
    tries++;
    setStatus('off', 'not connected');
    showOverlay(tries < 4 ? 'Starting your Kali Linux desktop… ' + (tries > 1 ? `(attempt ${tries})` : '')
                          : msg + '  Kali might still be booting its desktop — this page keeps trying.');
    timer = setTimeout(connect, Math.min(1500 + tries * 700, 6000));
  }

  // ---- toolbar ----
  $('#b-cad').onclick = () => rfb && rfb.sendCtrlAltDel();
  $('#b-re').onclick = () => { tries = 0; connect(); };
  $('#b-back').onclick = () => { if (window.opener && !window.opener.closed) { window.opener.focus(); } else { location.href = (new URLSearchParams(location.search)).get('back') || 'http://127.0.0.1:7860/'; } };
  $('#b-clip').onclick = async () => {
    try { const t = await navigator.clipboard.readText(); if (t && rfb) { rfb.clipboardPasteFrom(t); rfb.focus(); } }
    catch (e) { alert('Clipboard access blocked by the browser. Allow clipboard for this page and try again.'); }
  };
  // Kali → browser clipboard
  const pushClip = (e) => { try { navigator.clipboard.writeText(e.detail.text); } catch (_) {} };

  const fsBtn = $('#b-fs');
  function toggleFs() {
    if (!document.fullscreenElement) { document.documentElement.requestFullscreen?.(); }
    else { document.exitFullscreen?.(); }
  }
  fsBtn.onclick = toggleFs;
  document.addEventListener('fullscreenchange', () => {
    const on = !!document.fullscreenElement;
    document.body.classList.toggle('fs', on);
    fsBtn.textContent = on ? '⤓ Exit full screen' : '⛶ Full screen';
    setTimeout(() => rfb && rfb.focus(), 50);
  });
  // in full screen, moving the mouse to the very top peeks the bar
  let peekT = null;
  $('#peek').addEventListener('mouseenter', () => { document.body.classList.add('peek'); });
  $('#bar').addEventListener('mouseleave', () => { if (document.body.classList.contains('fs')) { clearTimeout(peekT); peekT = setTimeout(() => document.body.classList.remove('peek'), 400); } });

  // keep the Kali desktop exactly the size of this window
  window.addEventListener('resize', () => { if (rfb) rfb.resizeSession = true; });
  window.addEventListener('beforeunload', () => { wantReconnect = false; });

  connect();
  // Kali → browser clipboard, on every (re)connection
  setInterval(() => { if (rfb && !rfb.__clip) { rfb.__clip = true; rfb.addEventListener('clipboard', pushClip); } }, 500);
</script>
</body>
</html>
