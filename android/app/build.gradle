plugins { id 'com.android.application' }

android {
    namespace 'com.nanban.app'
    compileSdk 34

    defaultConfig {
        applicationId 'com.nanban.app'
        minSdk 24               // Android 7.0+ — covers 99% of phones
        targetSdk 34
        versionCode 1
        versionName '1.0.0'
    }

    buildTypes {
        release {
            // Debug-signing for easy sideload; swap to a real keystore for Play Store.
            signingConfig signingConfigs.debug
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
}
