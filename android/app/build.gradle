plugins { id 'com.android.application' }

android {
    namespace 'com.nanban.app'
    compileSdk 34

    defaultConfig {
        applicationId 'com.nanban.app'
        minSdk 24               // Android 7.0+ — covers 99% of phones
        targetSdk 34
        versionCode 1
        versionName '1.0.0'
    }

    buildTypes {
        release {
            // Debug-signing for easy sideload; swap to a real keystore for Play Store.
            signingConfig signingConfigs.debug
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // Keep every kotlin-stdlib module on one version. Without this, appcompat
    // pulls stdlib 1.8.22 while an older library pulls stdlib-jdk7/jdk8 1.6.21,
    // and the build fails with "Duplicate class kotlin.…".
    implementation platform('org.jetbrains.kotlin:kotlin-bom:1.8.22')
    implementation 'androidx.appcompat:appcompat:1.7.0'
}
